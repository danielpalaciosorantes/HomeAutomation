#cloud-config
hostname: ${HOSTNAME}
manage_etc_hosts: true

users:
  - name: bmanager
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${SSH_PUB_KEY}

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - openssl
  - ufw
  - fail2ban
  - qemu-guest-agent

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
      X11Forwarding no

  - path: /opt/mosquitto/config/mosquitto.conf
    permissions: "0644"
    content: |
      persistence true
      persistence_location /mosquitto/data/

      log_dest stdout

      # Plain MQTT listener, useful for debugging
      listener 1884
      allow_anonymous false
      password_file /mosquitto/config/passwordfile

      # MQTT over TLS
      listener 8884
      allow_anonymous false
      password_file /mosquitto/config/passwordfile

      cafile /mosquitto/config/certs/ca.crt
      certfile /mosquitto/config/certs/server.crt
      keyfile /mosquitto/config/certs/server.key
      tls_version tlsv1.2

  - path: /opt/mosquitto/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        mosquitto:
          image: eclipse-mosquitto:2
          container_name: mosquitto
          restart: unless-stopped
          ports:
            - "1884:1884"
            - "8884:8884"
          volumes:
            - ./config:/mosquitto/config
            - ./data:/mosquitto/data
            - ./log:/mosquitto/log

runcmd:
  # Guest agent
  - systemctl enable --now qemu-guest-agent || true

  # SSH hardening reload
  - systemctl reload ssh || systemctl reload sshd || true

  # Basic firewall
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 1884/tcp
  - ufw allow 8884/tcp
  - ufw --force enable

  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Make sure Docker is enabled
  - systemctl enable --now docker

  # Allow bmanager to use Docker without sudo after next login
  - usermod -aG docker bmanager || true

  # Prepare Mosquitto directories
  - mkdir -p /opt/mosquitto/config /opt/mosquitto/data /opt/mosquitto/log /opt/mosquitto/config/certs

  # Generate local CA
  - openssl genrsa -out /opt/mosquitto/config/certs/ca.key 4096
  - openssl req -x509 -new -nodes -key /opt/mosquitto/config/certs/ca.key -sha256 -days 3650 -out /opt/mosquitto/config/certs/ca.crt -subj "/CN=home-mqtt-ca"

  # Generate Mosquitto server key
  - openssl genrsa -out /opt/mosquitto/config/certs/server.key 2048

  # Create OpenSSL config with DNS and IP SANs
  - |
    cat >/opt/mosquitto/config/certs/server-openssl.cnf <<'EOF'
    [req]
    default_bits = 2048
    prompt = no
    default_md = sha256
    distinguished_name = dn
    req_extensions = req_ext

    [dn]
    CN = mqtt-01

    [req_ext]
    subjectAltName = @alt_names

    [alt_names]
    DNS.1 = mqtt-01
    DNS.2 = mqtt-01.local
    IP.1 = 192.168.178.15
    EOF

  # Create certificate signing request
  - openssl req -new -key /opt/mosquitto/config/certs/server.key -out /opt/mosquitto/config/certs/server.csr -config /opt/mosquitto/config/certs/server-openssl.cnf

  # Sign server certificate with local CA
  - openssl x509 -req -in /opt/mosquitto/config/certs/server.csr -CA /opt/mosquitto/config/certs/ca.crt -CAkey /opt/mosquitto/config/certs/ca.key -CAcreateserial -out /opt/mosquitto/config/certs/server.crt -days 825 -sha256 -extensions req_ext -extfile /opt/mosquitto/config/certs/server-openssl.cnf

  # Create Mosquitto password file using the Mosquitto container itself
  - docker run --rm -v /opt/mosquitto/config:/mosquitto/config eclipse-mosquitto:2 mosquitto_passwd -b -c /mosquitto/config/passwordfile ${MQTT_USERNAME} '${MQTT_PASSWORD}'

  # Fix ownership and permissions for the Mosquitto container user
  - chown -R 1883:1883 /opt/mosquitto
  - chmod 0755 /opt/mosquitto
  - chmod 0755 /opt/mosquitto/config
  - chmod 0755 /opt/mosquitto/data
  - chmod 0755 /opt/mosquitto/log
  - chmod 0755 /opt/mosquitto/config/certs
  - chmod 0644 /opt/mosquitto/config/mosquitto.conf
  - chmod 0640 /opt/mosquitto/config/passwordfile
  - chmod 0644 /opt/mosquitto/config/certs/ca.crt
  - chmod 0644 /opt/mosquitto/config/certs/server.crt
  - chmod 0640 /opt/mosquitto/config/certs/server.key

  # Start Mosquitto
  - cd /opt/mosquitto && docker compose up -d

  # Show status in cloud-init logs
  - docker ps